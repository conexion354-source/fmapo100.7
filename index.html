        --page: #06110F; --bg: #0B1D1B; --ink: #F2F7F5; --muted: #A9C4BE; --faint: #8FAAA4;

        --play-bg: #FFD84D; --play-fg: #0B1D1B; --play-shadow: 0 12px 30px rgba(255,216,77,.35);
        --surface: rgba(255,255,255,.05); --surface-2: rgba(255,255,255,.1);
        --line: rgba(255,255,255,.07); --line-strong: rgba(255,255,255,.14);
        --nav-bg: rgba(9,24,22,.94); --pill: rgba(255,216,77,.16); --sheet: #132926; --input-bg: rgba(255,255,255,.07);
        --live: #FF5A52; --live-text: #FFB3AE; --live-bg: rgba(255,90,82,.16); --live-border: rgba(255,90,82,.4);

      }
      .fm-light {
        --page: #DCE6E2; --bg: #F4F7F3; --ink: #10302B; --muted: #4E6B65; --faint: #5F7974;

        --play-bg: #2F5F5A; --play-fg: #FFD84D; --play-shadow: 0 12px 28px rgba(47,95,90,.35);
        --surface: rgba(16,48,43,.04); --surface-2: rgba(16,48,43,.08);
        --line: rgba(16,48,43,.08); --line-strong: rgba(16,48,43,.16);
        --nav-bg: rgba(255,255,255,.95); --pill: #FFE68A; --sheet: #FFFFFF; --input-bg: #FFFFFF;
        --live: #D93A33; --live-text: #C0302A; --live-bg: #FFE4E1; --live-border: #F5B5AF;
        --wa-bg: #DDF6E6; --wa-fg: #1C7A43; --eq: #2F5F5A; --track: rgba(16,48,43,.14);
        --mine-bg: #2F5F5A; --mine-fg: #FFFFFF; --other-bg: #FFFFFF; --other-shadow: 0 1px 2px rgba(16,48,43,.1);
        --cover-shadow: 0 22px 44px rgba(16,48,43,.28);
        --backdrop-opacity: .35; --backdrop-fade: linear-gradient(180deg, rgba(244,247,243,.2) 0%, rgba(244,247,243,.85) 52%, #F4F7F3 78%);
        --live-card-bg: #FFF6D1; --live-card-border: #EBCB5A; --live-card-time: #7A5D00;
      }
      .fm-theme { font-family: Manrope, ui-sans-serif, system-ui, sans-serif; color: var(--ink); }
      .fm-round-btn { display: flex; align-items: center; justify-content: center; flex-shrink: 0; border-radius: 9999px; background: var(--surface-2); color: var(--ink); transition: transform .15s ease; }
      .fm-round-btn:active { transform: scale(.92); }
      .fm-backdrop { position: absolute; left: -30%; top: -10%; width: 160%; height: 75%; object-fit: cover; filter: blur(60px) saturate(1.3); opacity: var(--backdrop-opacity); pointer-events: none; z-index: 0; transition: opacity 1s; }
      .fm-backdrop-fade { position: absolute; inset: 0; background: var(--backdrop-fade); pointer-events: none; z-index: 0; }
      .fm-eq-bar { width: 5px; border-radius: 3px; background: var(--eq); transform-origin: bottom; transform: scaleY(.35); transition: transform .4s ease; }
      .fm-eq-on .fm-eq-bar { animation: fmEq 1s ease-in-out infinite; }
      @keyframes fmEq { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
      .fm-play-ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--play-bg); animation: fmRing 2.2s ease-out infinite; pointer-events: none; }
      @keyframes fmRing { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(1.45); opacity: 0; } }
      .fm-live-dot { box-shadow: 0 0 10px var(--live); }
      .fm-input { background: var(--input-bg); border-color: var(--line-strong); color: var(--ink); }
      .fm-input::placeholder { color: var(--faint); }
      .fm-input:focus { border-color: var(--accent); }
      .volume-thumb { width: 18px; height: 18px; border: 3px solid var(--accent); box-sizing: border-box; transform: translate(-50%, -50%); box-shadow: 0 2px 8px rgba(0,0,0,.3); transition: transform .15s ease, box-shadow .15s ease; }
      .volume-slider:hover .volume-thumb, .volume-thumb.is-dragging { transform: translate(-50%, -50%) scale(1.2); box-shadow: 0 0 0 6px var(--pill), 0 2px 8px rgba(0,0,0,.3); }
      .volume-slider:focus-visible .volume-thumb { box-shadow: 0 0 0 4px var(--pill), 0 0 0 6px var(--accent); }
      .volume-slider[aria-disabled="true"] .volume-thumb { transform: translate(-50%, -50%); }
      .install-cta-breathe { animation: installBreathe 2s ease-in-out infinite; }
      @keyframes installBreathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }
      .animate-spin-slow { animation: spin 2s linear infinite; }
      @media (prefers-reduced-motion: reduce) {
        .fm-eq-on .fm-eq-bar, .fm-play-ring, .install-cta-breathe { animation: none; }
      }
      .app-fallback { min-height: 100%; display: grid; place-items: center; color: #F2F7F5; text-align: center; padding: 2rem; box-sizing: border-box; }
      .app-fallback img { width: 96px; height: 96px; border-radius: 24px; object-fit: cover; margin: 0 auto 1rem; box-shadow: 0 20px 45px rgba(0,0,0,.35); }
      .app-fallback p { margin: .35rem 0 0; color: #A9C4BE; font-size: .875rem; }

    <script>

    <script type="text/babel" data-presets="env,react">
      const { useState, useRef, useEffect, useMemo } = React;
      const {
        Play,
        Pause,
        Radio,
        Volume2,
        VolumeX,
        Volume1,
        X,
        MessageCircle,
        MoreVertical,
        Minus,
        CalendarDays,
        MonitorPlay,
        Youtube,
        Facebook,
        Users,
        Sun,
        Moon,
        Clock,
        RefreshCw,
        RotateCcw,
        SunMoon,
        Loader2,
        Bell,
        BellRing,
        Share2,
        Download,
        AlertTriangle,
        Send,
        User,
        Trash2,
        Smile
      } = LucideReact;

      // Compat helpers para soportar sintaxis modular sobre SDK compat
      const initializeApp = (config) => {
        if (!config || typeof firebase === 'undefined') return null;
        return firebase.apps && firebase.apps.length ? firebase.app() : firebase.initializeApp(config);
      };
      const getAuth = (app) => app ? firebase.auth(app) : null;
      const getFirestore = (app) => app ? firebase.firestore(app) : null;
      const signInAnonymously = (authRef) => authRef.signInAnonymously();
      const signInWithCustomToken = (authRef, token) => authRef.signInWithCustomToken(token);
      const onAuthStateChanged = (authRef, cb) => authRef.onAuthStateChanged(cb);
      const serverTimestamp = () => firebase.firestore.FieldValue.serverTimestamp();

      const resolvePath = (dbRef, segments) => {
        let ref = dbRef;
        segments.forEach((segment, index) => {
          ref = index % 2 === 0 ? ref.collection(segment) : ref.doc(segment);
        });
        return ref;
      };

      const collection = (dbRef, ...segments) => resolvePath(dbRef, segments);
      const doc = (dbRef, ...segments) => resolvePath(dbRef, segments);
      const addDoc = (collectionRef, data) => collectionRef.add(data);
      const onSnapshot = (ref, next, error) => ref.onSnapshot(next, error);
      const query = (ref) => ref;
      const setDoc = (docRef, data, opts) => docRef.set(data, opts);
      const deleteDoc = (docRef) => docRef.delete();

      const rawFirebaseConfig = (typeof __firebase_config !== 'undefined' && __firebase_config)
        ? __firebase_config
        : (window.__firebase_config || null);
      const parsedFirebaseConfig = typeof rawFirebaseConfig === 'string'
        ? JSON.parse(rawFirebaseConfig)
        : rawFirebaseConfig;

      const appId = typeof __app_id !== 'undefined' ? __app_id : (window.__app_id || 'radio-apocalipsis-default');
      const app = initializeApp(parsedFirebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      const CHAT_HISTORY_LIMIT = 100;
      const MAX_MESSAGE_LENGTH = 300;
      const MAX_NAME_LENGTH = 15;
      const REMINDER_LEAD_MINUTES = 5;
      const DAY_LETTERS = ['D', 'L', 'M', 'X', 'J', 'V', 'S'];

      const TikTokIcon =({ size = 24, className = "" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor" className={className}>
          <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/>
        </svg>
      );

      const isStandaloneDisplayMode = () => (
        window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true
      );

      function App() {
        const [isPlaying, setIsPlaying] = useState(false);
        const [activeTab, setActiveTab] = useState('home');
        const [volume, setVolume] = useState(() => {
          try {
            const saved = Number.parseInt(window.localStorage.getItem('fm-volume'), 10);
            return Number.isFinite(saved) && saved > 0 && saved <= 100 ? saved : 80;
          } catch (_) {
            return 80;
          }
        });
        const [volumeDragging, setVolumeDragging] = useState(false);
        // true cuando el dispositivo no deja cambiar el volumen desde la página (iPhone sin CORS).
        const [volumeLocked, setVolumeLocked] = useState(false);
        const volumeTrackRef = useRef(null);
        const [isMuted, setIsMuted] = useState(false);
        const [selectedDay, setSelectedDay] = useState(() => DAY_LETTERS[new Date().getDay()]);
        const [onlineCount, setOnlineCount] = useState(null);
        const [streamOnline, setStreamOnline] = useState(null);
        const streamOnlineRef = useRef(null);
        streamOnlineRef.current = streamOnline;
        const [installDismissed, setInstallDismissed] = useState(() => {
          try {
            const until = Number(window.localStorage.getItem('fm-install-dismissed') || 0);
            return until > Date.now();
          } catch (_) {
            return false;
          }
        });
        const dismissInstall = () => {
          setInstallDismissed(true);
          try { window.localStorage.setItem('fm-install-dismissed', String(Date.now() + 7 * 86400000)); } catch (_) {}
        };
        const [streamError, setStreamError] = useState(false);
        const [nowPlaying, setNowPlaying] = useState('');
        const [updateWorker, setUpdateWorker] = useState(null);
        const [applyingUpdate, setApplyingUpdate] = useState(false);
        const [updateMinimized, setUpdateMinimized] = useState(false);
        const audioGraph = useRef(null);
        const nativeVolumeSupported = useRef(null);
        const updateRequested = useRef(false);

        useEffect(() => {
          if (!('serviceWorker' in navigator) || !window.isSecureContext) return;
          let disposed = false;
          let registration;
          let installing;
          const onInstalled = () => {
            if (!disposed && registration?.waiting && navigator.serviceWorker.controller) {
              setUpdateWorker(registration.waiting);
            }
          };
          const onUpdateFound = () => {
            installing?.removeEventListener('statechange', onInstalled);
            installing = registration.installing;
            installing?.addEventListener('statechange', onInstalled);
          };
          const checkForUpdate = () => {
            if (document.visibilityState === 'visible') registration?.update().catch(() => {});
          };
          const onControllerChange = () => {
            if (updateRequested.current) window.location.reload();
          };
          navigator.serviceWorker.addEventListener('controllerchange', onControllerChange);
          navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then((reg) => {
            if (disposed) return;
            registration = reg;
            registration.addEventListener('updatefound', onUpdateFound);
            onUpdateFound();
            onInstalled();
            checkForUpdate();
          }).catch(() => {});
          document.addEventListener('visibilitychange', checkForUpdate);
          window.addEventListener('online', checkForUpdate);
          const timer = setInterval(checkForUpdate, 60000);
          return () => {
            disposed = true;
            clearInterval(timer);
            registration?.removeEventListener('updatefound', onUpdateFound);
            installing?.removeEventListener('statechange', onInstalled);
            navigator.serviceWorker.removeEventListener('controllerchange', onControllerChange);
            document.removeEventListener('visibilitychange', checkForUpdate);
            window.removeEventListener('online', checkForUpdate);
          };
        }, []);

        const applyUpdate = () => {
          if (!updateWorker) return;
          if (updateWorker.state === 'activated') {
            window.location.reload();
            return;
          }
          updateRequested.current = true;
          setApplyingUpdate(true);
          // Release the live connection before replacing the offline worker.
          if (audioRef.current) {
            audioRef.current.pause();
            audioRef.current.removeAttribute('src');
            audioRef.current.load();
          }
          updateWorker.postMessage({ type: 'SKIP_WAITING' });
        };

        const [user, setUser] = useState(null);
        const [messages, setMessages] = useState([]);
        const [newMessage, setNewMessage] = useState('');
        const [userName, setUserName] = useState(() => {
          try {
            return window.localStorage.getItem('fm-chat-apodo') || '';
          } catch (_) {
            return '';
          }
        });
        const [isSettingName, setIsSettingName] = useState(false);
        const chatReadKey = `fm-chat-read-${appId}`;
        const [readMessageIds, setReadMessageIds] = useState(() => {
          try {
            const saved = JSON.parse(window.localStorage.getItem(chatReadKey) || '[]');
            return new Set(Array.isArray(saved) ? saved.filter((id) => typeof id === 'string') : []);
          } catch (_) {
            return new Set();
          }
        });
        const [pageVisible, setPageVisible] = useState(() => document.visibilityState === 'visible');
        const unreadCount = messages.filter((msg) => msg.userId !== user?.uid && !readMessageIds.has(msg.id)).length;

        useEffect(() => {
          const onVisibilityChange = () => setPageVisible(document.visibilityState === 'visible');
          document.addEventListener('visibilitychange', onVisibilityChange);
          return () => document.removeEventListener('visibilitychange', onVisibilityChange);
        }, []);
        const [isInputFocused, setIsInputFocused] = useState(false);
        const [msgToDelete, setMsgToDelete] = useState(null);
        const [showEmojis, setShowEmojis] = useState(false);
        const chatScrollRef = useRef(null);
        const pressTimer = useRef(null);
        const sendingRef = useRef(false);

        const [scheduleData, setScheduleData] = useState({
          'L': [], 'M': [], 'X': [], 'J': [], 'V': [], 'S': [], 'D': []
        });
        const [promoGifs, setPromoGifs] = useState([]);

        const [currentAdIndex, setCurrentAdIndex] = useState(0);
        const [reminders, setReminders] = useState(() => {
          try {
            const saved = JSON.parse(window.localStorage.getItem('fm-reminders') || '[]');
            return new Set(Array.isArray(saved) ? saved.filter((key) => typeof key === 'string') : []);
          } catch (_) {
            return new Set();
          }
        });
        const [toastMsg, setToastMsg] = useState(null);
        const [themeMode, setThemeMode] = useState(() => {
          try {
            return window.localStorage.getItem('fm-theme-mode') || 'auto';
          } catch (_) {
            return 'auto';
          }
        });
        const [isDark, setIsDark] = useState(true);
        const [currentProgram, setCurrentProgram] = useState(null);
        const [viewportHeight, setViewportHeight] = useState(() => window.innerHeight);
        const [viewportWidth, setViewportWidth] = useState(() => window.innerWidth);
        const artAreaRef = useRef(null);
        const [artSize, setArtSize] = useState(0);
        // Pantallas bajas (notebooks 720p, ventanas chicas, app instalada en PC).
        const isShortScreen = viewportHeight < 640;
        // Celular acostado o ventana muy apaisada: portada a la izquierda y controles a la derecha.
        const isLandscapeHome = viewportWidth > viewportHeight * 1.25 && viewportHeight < 560 && viewportWidth >= 520;
        // En PC la tarjeta flotante solo deja márgenes si sobra altura.
        const useFloatingCard = viewportHeight >= 720;
        const [viewportOffsetTop, setViewportOffsetTop] = useState(0);
        const [keyboardOpen, setKeyboardOpen] = useState(false);

        const [deferredPrompt, setDeferredPrompt] = useState(null);
        const [isInstallable, setIsInstallable] = useState(false);
        const [isAppInstalled, setIsAppInstalled] = useState(() => isStandaloneDisplayMode());

        const audioRef = useRef(null);
        const [isBuffering, setIsBuffering] = useState(false);
        const reloadingRef = useRef(false);
        const userPausedRef = useRef(true);
        const reconnectAttempts = useRef(0);
        const reconnectTimer = useRef(null);
        const toastTimer = useRef(null);
        const stallTimer = useRef(null);
        const streamUrl = "https://server.streamcasthd.com/8422/stream";
        const statsUrl = "https://server.streamcasthd.com:7210/stats?sid=1&json=1";
        const googleSheetsCsvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQP-N3so4cbqVC-4RfmlqZlRZapDugeYTSfrAjDKj8UghSOuqrvipAXXTQBCV5WEIoSajBhLoYfk5cO/pub?output=csv";

        const timeToMinutes = (value) => {
          if (!value) return Number.MAX_SAFE_INTEGER;
          const match = String(value).trim().match(/^(\d{1,2})(?::(\d{1,2}))?/);
          if (!match) return Number.MAX_SAFE_INTEGER;
          const hours = Number.parseInt(match[1], 10);
          const minutes = Number.parseInt(match[2] || '0', 10);
          if (!Number.isFinite(hours) || !Number.isFinite(minutes)) return Number.MAX_SAFE_INTEGER;
          return (hours * 60) + minutes;
        };

        const normalizeHeader = (value) => String(value || '')
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .trim()
          .toLowerCase();

        const findColumnIndex = (headers, aliases) => {
          const normalizedAliases = aliases.map(normalizeHeader);
          return headers.findIndex((header) => normalizedAliases.includes(normalizeHeader(header)));
        };

        const normalizeWhatsAppPhone = (value) => {
          const digits = String(value || '').replace(/\D/g, '');
          return digits.length >= 8 ? digits : '';
        };

        const getWhatsAppUrl = (program) => {
          const phone = normalizeWhatsAppPhone(program?.phone);
          if (!phone) return '';
          const message = encodeURIComponent(`Hola, escucho ${program?.title || 'el programa'} por FM Apocalipsis 100.7`);
          return `https://wa.me/${phone}?text=${message}`;
        };

        const formatMsgDate = (timestamp) => {
          if (!timestamp) return "";
          try {
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return new Intl.DateTimeFormat('es-AR', { hour: '2-digit', minute: '2-digit' }).format(date);
          } catch (e) {
            return "";
          }
        };

        const toggleThemeMode = () => {
          if (themeMode === 'auto') setThemeMode('light');
          else if (themeMode === 'light') setThemeMode('dark');
          else setThemeMode('auto');
        };

        useEffect(() => {
          const visualViewport = window.visualViewport;
          const updateViewport = () => {
            const currentHeight = visualViewport ? Math.round(visualViewport.height) : window.innerHeight;
            setViewportHeight(currentHeight);
            setViewportWidth(visualViewport ? Math.round(visualViewport.width) : window.innerWidth);
            const currentOffsetTop = visualViewport ? Math.max(0, Math.round(visualViewport.offsetTop)) : 0;
            setViewportOffsetTop(currentOffsetTop);

            const delta = window.innerHeight - currentHeight;
            setKeyboardOpen(activeTab === 'chat' && delta > 120);
          };

          updateViewport();
          window.addEventListener('resize', updateViewport);
          if (visualViewport) {
            visualViewport.addEventListener('resize', updateViewport);
            visualViewport.addEventListener('scroll', updateViewport);
          }

          return () => {
            window.removeEventListener('resize', updateViewport);
            if (visualViewport) {
              visualViewport.removeEventListener('resize', updateViewport);
              visualViewport.removeEventListener('scroll', updateViewport);
            }
          };
        }, [activeTab]);

        useEffect(() => {

          clearTimeout(reconnectTimer.current);
          clearTimeout(stallTimer.current);
        }, []);

        // Cuando la radio vuelve al aire y el oyente había querido escuchar, se reconecta solo.
        useEffect(() => {
          if (streamOnline === true && streamError && !userPausedRef.current) {
            reconnectAttempts.current = 0;
            syncToLive();
          }
        }, [streamOnline]);

        // Si con CORS no carga (y nunca cargó así) en iPhone, se vuelve al modo normal.
        // Devuelve true si se reintenta sin CORS.
        const handleCorsFailure = () => {
          const audio = audioRef.current;
          if (!audio || audio.crossOrigin !== 'anonymous' || audioGraph.current || streamCorsOk.current === true) return false;
          if (streamOnlineRef.current === false) return false; // falla porque la radio no transmite, no por CORS
          streamCorsOk.current = false;
          audio.removeAttribute('crossorigin');
          setVolumeLocked(true);
          if (!userPausedRef.current) setTimeout(() => syncToLive(), 0);
          return true;
        };

        // Mantiene el botón y el texto "SONANDO / PAUSADO" sincronizados con lo que
        // realmente hace el audio (auriculares, pantalla de bloqueo, cortes de red).
        const audioEvents = {
          onPlaying: () => {
            const audio = audioRef.current;
            if (audio && audio.crossOrigin === 'anonymous' && needsVolumeGraph() && streamCorsOk.current !== true) {
              streamCorsOk.current = true;
              setVolumeLocked(false);
              try { window.localStorage.setItem('fm-stream-cors', '1'); } catch (_) {}
            }
            setIsPlaying(true);
            setIsBuffering(false);
            setStreamError(false);
            reconnectAttempts.current = 0;
          },
          onWaiting: () => {
            setIsBuffering(true);
            startStallWatchdog();
          },
          onPause: () => {
            if (reloadingRef.current) return;
            setIsPlaying(false);
            setIsBuffering(false);
            if (!userPausedRef.current && audioRef.current && !audioRef.current.ended) {
              // Pausa externa (auriculares, llamada, otra app): se respeta como pausa del oyente.
              userPausedRef.current = true;
            }
          },
          onEnded: () => {
            setIsPlaying(false);
            scheduleReconnect();
          },
          onStalled: () => startStallWatchdog(),
          onError: () => {
            const audio = audioRef.current;
            if (!audio || !audio.getAttribute('src') || updateRequested.current) return;
            setIsPlaying(false);
            if (handleCorsFailure()) return;
            if (userPausedRef.current) return;
            scheduleReconnect();
          }
        };

        const setVolumeLevel = (value) => {
          const v = Math.max(0, Math.min(100, Math.round(value)));
          resumeVolumeControl();
          setVolume(v);
          setIsMuted(v === 0);
          applyVolume(v, v === 0);
        };

        const volumeFromPointer = (clientX) => {
          const track = volumeTrackRef.current;
          if (!track) return;
          const rect = track.getBoundingClientRect();
          if (!rect.width) return;
          setVolumeLevel(((clientX - rect.left) / rect.width) * 100);
        };

        const volumePointerHandlers = {
          onPointerDown: (e) => {
            if (e.button !== undefined && e.button !== 0) return;
            e.preventDefault();
            try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
            e.currentTarget.focus({ preventScroll: true });
            setVolumeDragging(true);
            volumeFromPointer(e.clientX);
          },
          onPointerMove: (e) => {
            if (volumeDragging) volumeFromPointer(e.clientX);
          },
          onPointerUp: () => setVolumeDragging(false),
          onPointerCancel: () => setVolumeDragging(false),
          onLostPointerCapture: () => setVolumeDragging(false)
        };

        const handleVolumeKey = (e) => {
          const current = isMuted ? 0 : volume;
          const steps = { ArrowLeft: -5, ArrowDown: -5, ArrowRight: 5, ArrowUp: 5, PageDown: -10, PageUp: 10 };
          if (e.key in steps) setVolumeLevel(current + steps[e.key]);
          else if (e.key === 'Home') setVolumeLevel(0);
          else if (e.key === 'End') setVolumeLevel(100);
          else return;
          e.preventDefault();
        };

        const resumeVolumeControl = () => {
          ensureVolumeGraph();
          const context = audioGraph.current?.context;
          if (context && context.state !== 'running') context.resume().catch(() => {});
        };

        const applyVolume = (value, muted) => {
          const audio = audioRef.current;
          if (!audio) return;
          const level = muted ? 0 : Math.pow(value / 100, 2);
          const graph = audioGraph.current;
          audio.muted = muted || value === 0;
          audio.volume = graph ? 1 : level;
          if (graph) {
            graph.gain.gain.cancelScheduledValues(graph.context.currentTime);
            graph.gain.gain.setValueAtTime(level, graph.context.currentTime);
          }
        };

        const toggleMute = () => {
          resumeVolumeControl();
          const nextMuted = !(isMuted || volume === 0);
          const nextVolume = volume || 80;
          setIsMuted(nextMuted);
          setVolume(nextVolume);
          applyVolume(nextVolume, nextMuted);
        };

        useEffect(() => { applyVolume(volume, isMuted); }, [volume, isMuted]);

        // Recuerda el último volumen elegido (no se guarda el 0 para no arrancar muda).
        useEffect(() => {
          if (volume <= 0) return;
          try { window.localStorage.setItem('fm-volume', String(volume)); } catch (_) {}
        }, [volume]);

        // Título, imagen y controles de la pantalla de bloqueo / notificación del celular.
        useEffect(() => {
          if (!('mediaSession' in navigator) || typeof MediaMetadata === 'undefined') return;
          // Arma la dirección completa de la imagen; si no se puede (vista previa, archivo local),
          // se usa tal cual. Nunca debe romper la app.
          const toAbsoluteUrl = (src) => {
            try { return new URL(src, document.baseURI).href; } catch (_) { return src; }
          };
          try {
            const artworkSrc = toAbsoluteUrl(currentDisplayedImage || 'icons/icon-512.png');
            navigator.mediaSession.metadata = new MediaMetadata({
              title: metadataText,
              artist: currentProgram?.title && currentProgram.title !== metadataText
                ? String(currentProgram.title)
                : 'FM Apocalipsis 100.7',
              album: 'La voz que viene de lo alto',
              artwork: artworkSrc ? [{ src: artworkSrc, sizes: '512x512' }] : []
            });
            navigator.mediaSession.playbackState = isPlaying ? 'playing' : 'paused';
          } catch (_) {
          }
        }, [metadataText, currentDisplayedImage, currentProgram, isPlaying]);

        const mediaActions = useRef({});
        mediaActions.current = { play: startPlayback, pause: pausePlayback };
        useEffect(() => {
          if (!('mediaSession' in navigator)) return;
          const handlers = {
            play: () => mediaActions.current.play(),
            pause: () => mediaActions.current.pause(),
            stop: () => mediaActions.current.pause()
          };
          Object.entries(handlers).forEach(([action, handler]) => {
            try { navigator.mediaSession.setActionHandler(action, handler); } catch (_) {}
          });
          return () => {
            Object.keys(handlers).forEach((action) => {
              try { navigator.mediaSession.setActionHandler(action, null); } catch (_) {}
            });
          };
        }, []);

        const showToast = (msg) => {
          setToastMsg(msg);

        useEffect(() => {

          { name: 'Facebook', url: 'https://www.facebook.com/zonafe25', icon: <Facebook size={26} />, tint: '#4C8DFF', tintBg: 'rgba(76,141,255,.14)' },

        const EQ_HEIGHTS = [10, 18, 26, 14, 22, 30, 16, 24, 12, 28, 20, 30, 14, 26, 18, 22, 10, 28, 16, 24, 12, 20];

        const colorFor = (key) => {
          const text = String(key || '');
          let hash = 0;
          for (let i = 0; i < text.length; i++) hash = ((hash * 31) + text.charCodeAt(i)) | 0;
          return AVATAR_COLORS[Math.abs(hash) % AVATAR_COLORS.length];
        };
        const dayLabelFor = (timestamp) => {

              {activeTab === 'home' && (

              <audio ref={audioRef} src={streamUrl} preload="none" playsInline {...audioEvents} />

              <div role="status" aria-live="polite" className={`absolute top-[max(1.25rem,env(safe-area-inset-top,1.25rem))] left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full text-xs font-bold shadow-lg transition-all duration-300 w-max max-w-[90%] text-center ${toastMsg ? 'opacity-100 translate-y-0' : 'opacity-0 -translate-y-4 pointer-events-none'}`} style={{ background: 'var(--accent)', color: 'var(--on-accent)' }}>
                {toastMsg}
              </div>

              {/* Encabezado */}
              <div className={`relative z-10 flex items-center gap-2 min-[360px]:gap-3 shrink-0 ${isShortScreen || isLandscapeHome ? 'pt-[max(0.75rem,env(safe-area-inset-top,0.75rem))] pb-2' : 'pt-[max(1.25rem,env(safe-area-inset-top,1.25rem))] sm:pt-7 pb-3'} px-3 min-[360px]:px-4 min-[390px]:px-5 ${activeTab === 'home' ? '' : 'border-b'}`} style={{ borderColor: 'var(--line)' }}>
                <img src="logo.png" alt="Logo FM Apocalipsis" className="w-9 h-9 min-[360px]:w-10 min-[360px]:h-10 min-[390px]:w-[42px] min-[390px]:h-[42px] rounded-xl object-cover shrink-0 shadow-md" />
                <div className="flex-1 min-w-0">
                  <h1 className="font-sora font-bold text-[14px] min-[360px]:text-[15px] min-[390px]:text-[17px] leading-tight truncate">{headerTitle}</h1>
                  <p className="text-xs mt-0.5 truncate flex items-center gap-1.5" style={{ color: 'var(--muted)' }}>
                    {activeTab === 'chat' && onlineCount ? <span className="w-[7px] h-[7px] rounded-full shrink-0" style={{ background: 'var(--wa-fg)' }} /> : null}

                {showHeaderActions && (

                    <button onClick={handleShare} aria-label="Compartir" title="Compartir" className="fm-round-btn w-9 h-9 min-[360px]:w-10 min-[360px]:h-10 min-[390px]:w-11 min-[390px]:h-11">
                      <Share2 size={19} />
                    </button>
                    <button onClick={toggleThemeMode} aria-label={`Tema: ${themeMode === 'auto' ? 'automático' : themeMode === 'dark' ? 'oscuro' : 'claro'}`} title="Tema: automático, claro u oscuro" className="fm-round-btn w-9 h-9 min-[360px]:w-10 min-[360px]:h-10 min-[390px]:w-11 min-[390px]:h-11">
                      {themeMode === 'auto' ? <SunMoon size={19} /> : themeMode === 'dark' ? <Moon size={19} /> : <Sun size={19} />}

              </div>

              {showInstallBanner && (

                      <button type="button" onClick={applyUpdate} disabled={applyingUpdate} className="w-full flex justify-center items-center gap-2 px-3 py-2.5 text-xs font-bold rounded-xl disabled:opacity-60" style={{ background: 'var(--accent)', color: 'var(--on-accent)' }}>

              <div className="flex-1 min-h-0 min-w-0 overflow-hidden relative z-10 flex flex-col">
                {/* ---------- RADIO ---------- */}
                {activeTab === 'home' && (

                        ))}
                      </div>

                      <div className={`flex items-center justify-center gap-[34px] shrink-0 ${isShortScreen || isLandscapeHome ? 'mt-3' : 'mt-7'}`}>
                        <button onClick={startPlayback} aria-label="Volver al vivo" title="Volver al vivo" className="fm-round-btn w-12 h-12">
                          <RotateCcw size={20} />
                        </button>
                        <div className={`relative ${isShortScreen || isLandscapeHome ? 'w-[68px] h-[68px]' : 'w-[84px] h-[84px]'}`}>
                          {isPlaying && <span aria-hidden="true" className="fm-play-ring" />}
                          <button onClick={togglePlay} aria-label={isPlaying || isBuffering ? 'Pausar' : 'Reproducir'} className="relative w-full h-full rounded-full flex items-center justify-center active:scale-95 hover:scale-[1.03] transition-transform" style={{ background: 'var(--play-bg)', color: 'var(--play-fg)', boxShadow: 'var(--play-shadow)' }}>
                            {isBuffering
                              ? <Loader2 size={30} className="animate-spin" />
                              : isPlaying
                                ? <Pause size={30} fill="currentColor" strokeWidth={0} />
                                : <Play size={32} fill="currentColor" strokeWidth={0} className="ml-1" />}
                          </button>
                        </div>
                        {currentWhatsAppUrl ? (
                          <a href={currentWhatsAppUrl} target="_blank" rel="noopener noreferrer" aria-label="WhatsApp del programa" title="WhatsApp del programa" className="w-12 h-12 rounded-full flex items-center justify-center active:scale-95 transition-transform" style={{ background: 'var(--wa-bg)', color: 'var(--wa-fg)' }}>
                            <MessageCircle size={20} />
                          </a>
                        ) : (
                          <span className="w-12 h-12" aria-hidden="true" />
                        )}
                      </div>

                      <div className={`w-full max-w-[322px] shrink-0 ${isShortScreen || isLandscapeHome ? 'mt-2' : 'mt-7 mb-2'}`}>
                        <div className="flex items-center gap-3" style={{ color: 'var(--muted)' }}>
                          <button
                            type="button"
                            onClick={toggleMute}
                            disabled={volumeLocked}
                            aria-label={isMuted || volume === 0 ? 'Activar sonido' : 'Silenciar'}
                            title={isMuted || volume === 0 ? 'Activar sonido' : 'Silenciar'}
                            className="w-9 h-11 shrink-0 flex items-center justify-center rounded-full disabled:opacity-40"
                          >
                            {isMuted || volume === 0 ? <VolumeX size={20} /> : <Volume1 size={20} />}
                          </button>
                          <div
                            role="slider"
                            tabIndex={volumeLocked ? -1 : 0}
                            aria-label="Volumen"
                            aria-valuemin={0}
                            aria-valuemax={100}
                            aria-valuenow={volumeLevel}
                            aria-valuetext={`${volumeLevel}%`}
                            aria-disabled={volumeLocked}
                            onKeyDown={volumeLocked ? undefined : handleVolumeKey}
                            {...(volumeLocked ? {} : volumePointerHandlers)}
                            className={`volume-slider relative flex-1 min-w-0 h-11 flex items-center outline-none ${volumeLocked ? 'opacity-40 cursor-not-allowed' : 'cursor-pointer'}`}
                            style={{ touchAction: 'none' }}
                          >
                            <div ref={volumeTrackRef} className="relative w-full h-1 rounded-full" style={{ background: 'var(--track)' }}>
                              <div className="absolute inset-y-0 left-0 rounded-full" style={{ width: `${volumeLevel}%`, background: 'var(--accent)' }} />
                              <div className={`volume-thumb absolute top-1/2 rounded-full bg-white ${volumeDragging ? 'is-dragging' : ''}`} style={{ left: `${volumeLevel}%` }} />
                            </div>
                          </div>
                          <output className="w-[38px] shrink-0 text-right text-xs font-bold tabular-nums" style={{ color: 'var(--accent-text)' }}>{volumeLevel}%</output>
                        </div>
                        {volumeLocked && (
                          <p className="mt-1 text-center text-[11px]" style={{ color: 'var(--muted)' }}>
                            En este teléfono el volumen se maneja con los botones del costado.
                          </p>
                        )}
                      </div>
                    </div>
                  </div>
                )}

                {/* ---------- CHAT ---------- */}
                {activeTab === 'chat' && (
                  <div className="flex-1 min-h-0 min-w-0 flex flex-col overflow-hidden">
                    <div ref={chatScrollRef} className="flex-1 min-h-0 overflow-y-auto px-3.5 pt-4 pb-3 custom-scrollbar select-none flex flex-col">
                      {messages.length === 0 ? (
                        <div className="m-auto flex flex-col items-center gap-2 text-center" style={{ color: 'var(--muted)' }}>
                          <MessageCircle size={40} />
                          <p className="text-sm">¡Sé el primero en saludar!</p>
                        </div>
                      ) : (
                        <div className="mt-auto flex flex-col gap-2.5">
                          {messages.map((msg, index) => {
                            const mine = msg.userId === user?.uid;
                            const label = dayLabelFor(msg.timestamp);
                            const showDay = index === 0 || label !== dayLabelFor(messages[index - 1].timestamp);
                            const tint = colorFor(msg.userId || msg.sender);
                            return (
                              <React.Fragment key={msg.id}>
                                {showDay && label && (
                                  <div className="self-center text-[11px] font-bold px-2.5 py-1 rounded-full capitalize" style={{ color: 'var(--faint)', background: 'var(--surface)' }}>{label}</div>
                                )}
                                <div
                                  className={`flex gap-2 items-end ${mine ? 'flex-row-reverse' : 'flex-row'}`}
                                  onTouchStart={() => handlePressStart(msg)}
                                  onTouchMove={handlePressCancel}
                                  onTouchEnd={handlePressCancel}
                                  onMouseDown={() => handlePressStart(msg)}
                                  onMouseMove={handlePressCancel}
                                  onMouseUp={handlePressCancel}
                                  onMouseLeave={handlePressCancel}
                                  onContextMenu={(e) => { if (mine) e.preventDefault(); }}
                                >
                                  {!mine && (
                                    <div aria-hidden="true" className="w-8 h-8 shrink-0 rounded-full flex items-center justify-center text-[13px] font-extrabold uppercase" style={{ background: tint, color: isDark ? '#0B1D1B' : '#FFFFFF' }}>
                                      {String(msg.sender || '?').trim().charAt(0) || '?'}
                                    </div>
                                  )}
                                  <div className={`max-w-[78%] px-3.5 pt-2 pb-1.5 ${mine ? 'rounded-[18px_18px_6px_18px]' : 'rounded-[18px_18px_18px_6px]'}`} style={mine ? { background: 'var(--mine-bg)', color: 'var(--mine-fg)' } : { background: 'var(--other-bg)', boxShadow: 'var(--other-shadow)' }}>
                                    {!mine && <div className="text-xs font-extrabold mb-0.5" style={{ color: tint }}>{msg.sender}</div>}
                                    <div className="text-[15px] leading-snug break-words">{msg.text}</div>
                                    <div className="text-[10px] opacity-65 text-right mt-0.5">{formatMsgDate(msg.timestamp)}</div>
                                  </div>
                                </div>
                              </React.Fragment>
                            );
                          })}
                        </div>
                      )}
                    </div>

                    {!keyboardOpen && (
                      <div className="flex gap-2 px-3 py-2 overflow-x-auto custom-scrollbar shrink-0">
                        {QUICK_REPLIES.map((text) => (
                          <button key={text} type="button" onClick={() => addQuickReply(text)} className="h-9 px-3 rounded-full border text-[13px] font-bold whitespace-nowrap active:scale-95 transition-transform" style={{ borderColor: 'var(--line-strong)', background: 'var(--surface)' }}>
                            {text}
                          </button>
                        ))}
                      </div>
                    )}

                    <form onSubmit={handleSendMessage} className={`flex gap-2.5 items-center px-3 pt-2 shrink-0 border-t ${isInputFocused || keyboardOpen ? 'pb-2' : 'pb-[max(0.75rem,env(safe-area-inset-bottom))]'}`} style={{ background: 'var(--nav-bg)', borderColor: 'var(--line)' }}>
                      <label htmlFor="chat-input" className="sr-only">Mensaje</label>
                      <input
                        id="chat-input"
                        type="text"
                        value={newMessage}
                        onChange={(e) => setNewMessage(e.target.value.slice(0, MAX_MESSAGE_LENGTH))}
                        maxLength={MAX_MESSAGE_LENGTH}
                        onFocus={() => {
                          setIsInputFocused(true);
                          if (!userName.trim()) setIsSettingName(true);
                        }}
                        onBlur={() => setTimeout(() => setIsInputFocused(false), 200)}
                        placeholder={userName.trim() ? 'Escribí un mensaje…' : 'Tocá para elegir tu nombre'}
                        onClick={() => !userName.trim() && setIsSettingName(true)}
                        readOnly={!userName.trim()}
                        className="flex-1 min-w-0 h-[46px] px-4 rounded-full border text-[16px] outline-none fm-input"
                      />
                      <button type="submit" aria-label="Enviar" className="w-[46px] h-[46px] shrink-0 rounded-full flex items-center justify-center active:scale-90 transition-transform" style={{ background: 'var(--accent)', color: 'var(--on-accent)' }}>
                        <Send size={19} />
                      </button>
                    </form>
                  </div>
                )}

                {/* ---------- EN VIVO ---------- */}
                {activeTab === 'live' && (
                  <div className="flex-1 min-h-0 flex flex-col px-4 pt-3 pb-4 overflow-y-auto custom-scrollbar">
                    <h2 className="font-sora font-extrabold text-[30px] leading-none mb-1">Ver en vivo</h2>
                    <p className="text-sm mb-5" style={{ color: 'var(--muted)' }}>Mirá la transmisión con imagen.</p>
                    <div className="flex flex-col gap-3">
                      {liveItems.map((social) => (
                        <a key={social.name} href={social.url} target="_blank" rel="noopener noreferrer" className="p-4 rounded-[20px] border flex items-center gap-4 active:scale-[0.99] transition-transform" style={{ background: 'var(--surface)', borderColor: 'var(--line)' }}>
                          <div className="w-14 h-14 rounded-2xl flex items-center justify-center shrink-0" style={{ background: social.tintBg, color: social.tint }}>{social.icon}</div>
                          <div className="flex-1 min-w-0">
                            <h3 className="font-sora font-bold text-[17px]">{social.name}</h3>
                            <p className="text-xs mt-0.5" style={{ color: 'var(--muted)' }}>Transmisión oficial</p>
                          </div>
                          <span className="text-xs font-extrabold px-3 py-2 rounded-full" style={{ background: 'var(--pill)', color: 'var(--accent-text)' }}>Abrir</span>
                        </a>
                      ))}
                    </div>
                  </div>
                )}

                {/* ---------- PROGRAMACIÓN ---------- */}
                {activeTab === 'schedule' && (
                  <div className="flex-1 min-h-0 flex flex-col px-4 pt-3 overflow-hidden">
                    <h2 className="font-sora font-extrabold text-[30px] leading-none shrink-0">Programación</h2>
                    <div className="grid grid-cols-7 gap-1 mt-4 p-[5px] rounded-[18px] shrink-0" style={{ background: 'var(--surface)' }}>
                      {['L', 'M', 'X', 'J', 'V', 'S', 'D'].map((dayId) => {
                        const selected = selectedDay === dayId;
                        return (
                          <button key={dayId} onClick={() => setSelectedDay(dayId)} aria-pressed={selected} className="min-w-0 h-[52px] rounded-[14px] flex flex-col items-center justify-center gap-0.5 transition-colors" style={selected ? { background: 'var(--accent)', color: 'var(--on-accent)' } : { color: 'var(--muted)' }}>
                            <span className="text-[13px] font-bold">{DAY_NAMES[dayId]}</span>
                            <span className="text-[10px] font-semibold opacity-80 h-3 leading-3">{dayId === todayLetter ? 'Hoy' : ''}</span>
                          </button>
                        );
                      })}
                    </div>
                    <div className="flex-1 min-h-0 overflow-y-auto custom-scrollbar flex flex-col gap-2.5 pt-4 pb-4 -mx-1 px-1">
                      {scheduleData[selectedDay]?.length > 0 ? scheduleData[selectedDay].map((p, idx) => {
                        const key = getReminderKey(p);
                        const live = isCurrentProgram(p);
                        const isNext = !live && key === nextProgramKey;
                        const reminded = reminders.has(key);
                        if (live) {
                          const wa = getWhatsAppUrl(p);
                          return (
                            <div key={idx} className="p-4 rounded-[20px] border" style={{ background: 'var(--live-card-bg)', borderColor: 'var(--live-card-border)' }}>
                              <div className="flex items-center gap-2 mb-2.5">
                                <span className="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-[11px] font-extrabold tracking-wide text-white" style={{ background: 'var(--live)' }}><span className="w-1.5 h-1.5 rounded-full bg-white" />AL AIRE</span>
                                <span className="text-xs font-semibold" style={{ color: 'var(--live-card-time)' }}>{p.start} – {p.end}</span>
                              </div>
                              <div className="flex items-center gap-3">
                                <img src={p.image || 'logo.png'} alt="" onError={(e) => { e.target.src = 'logo.png'; }} className="w-14 h-14 rounded-[14px] object-cover shrink-0" />
                                <div className="flex-1 min-w-0">
                                  <h3 className="font-sora font-bold text-[17px] leading-tight line-clamp-2 break-words">{p.title}</h3>
                                  {p.hosts && <p className="text-[13px] mt-1" style={{ color: 'var(--muted)' }}>{p.hosts}</p>}
                                </div>
                              </div>
                              <div className="flex gap-2 mt-3.5">
                                <button type="button" onClick={listenNow} className="flex-1 h-11 rounded-[14px] font-extrabold text-sm flex items-center justify-center gap-2" style={{ background: 'var(--accent)', color: 'var(--on-accent)' }}>
                                  <Play size={16} fill="currentColor" strokeWidth={0} /> {isPlaying ? 'Escuchando' : 'Escuchar'}
                                </button>
                                {wa && (
                                  <a href={wa} target="_blank" rel="noopener noreferrer" className="flex-1 h-11 rounded-[14px] font-bold text-sm flex items-center justify-center gap-2" style={{ background: 'var(--wa-bg)', color: 'var(--wa-fg)' }}>
                                    <MessageCircle size={16} /> WhatsApp
                                  </a>
                                )}
                              </div>
                            </div>
                          );
                        }
                        return (
                          <div key={idx} className="flex items-center gap-3.5 py-3.5 pl-4 pr-3.5 rounded-[18px] border" style={{ background: 'var(--surface)', borderColor: 'var(--line)' }}>
                            <div className="w-[50px] shrink-0 text-center">
                              <div className="font-sora font-bold text-[15px]">{p.start}</div>
                              <div className="text-[11px] mt-0.5" style={{ color: 'var(--faint)' }}>{p.end}</div>
                            </div>
                            <div className="w-px self-stretch" style={{ background: 'var(--line-strong)' }} />
                            {p.image && <img src={p.image} alt="" onError={(e) => { e.target.style.display = 'none'; }} className="w-10 h-10 rounded-xl object-cover shrink-0" />}
                            <div className="flex-1 min-w-0">
                              {isNext && <div className="text-[10px] font-extrabold tracking-[0.06em] mb-0.5" style={{ color: 'var(--accent-text)' }}>A CONTINUACIÓN</div>}
                              <h3 className="font-bold text-[15px] leading-tight line-clamp-2 break-words">{p.title}</h3>
                              {p.hosts && <p className="text-xs mt-0.5" style={{ color: 'var(--muted)' }}>{p.hosts}</p>}
                            </div>
                            <button
                              onClick={() => toggleReminder(p)}
                              aria-pressed={reminded}
                              aria-label={reminded ? `Quitar recordatorio de ${p.title}` : `Recordarme ${p.title}`}
                              className="w-11 h-11 shrink-0 rounded-full flex items-center justify-center transition-colors"
                              style={reminded || isNext ? { background: 'var(--pill)', color: 'var(--accent-text)' } : { background: 'var(--surface)', color: 'var(--muted)' }}
                            >
                              {reminded ? <BellRing size={19} /> : <Bell size={19} />}
                            </button>
                          </div>
                        );
                      }) : <p className="text-center text-sm py-10 font-medium" style={{ color: 'var(--muted)' }}>Sin programación para este día.</p>}
                    </div>
                  </div>
                )}
              </div>

              {msgToDelete && (
                <div className="absolute inset-0 z-[100] flex items-center justify-center p-6 bg-black/60 backdrop-blur-sm">
                  <div className="w-full max-w-xs rounded-[2rem] p-6 shadow-2xl scale-in text-center" style={{ background: 'var(--sheet)' }}>
                    <div className="w-16 h-16 rounded-full flex items-center justify-center mb-4 mx-auto" style={{ background: 'var(--live-bg)', color: 'var(--live-text)' }}>
                      <Trash2 size={28} />
                    </div>
                    <h3 className="font-sora text-lg font-bold mb-1">¿Eliminar mensaje?</h3>
                    <p className="text-xs mb-6" style={{ color: 'var(--muted)' }}>Esta acción no se puede deshacer.</p>
                    <div className="flex gap-3">
                      <button onClick={() => setMsgToDelete(null)} className="flex-1 py-3 rounded-xl font-bold text-sm" style={{ background: 'var(--surface-2)' }}>Cancelar</button>
                      <button onClick={confirmDeleteMessage} className="flex-1 py-3 rounded-xl text-white font-bold text-sm" style={{ background: 'var(--live)' }}>Eliminar</button>
                    </div>
                  </div>
                </div>
              )}

              {isSettingName && (
                <div className="absolute inset-0 z-[60] flex items-center justify-center p-6 bg-black/60 backdrop-blur-md">
                  <div className="w-full max-w-xs rounded-[2.5rem] p-8 shadow-2xl scale-in border" style={{ background: 'var(--sheet)', borderColor: 'var(--line)' }}>
                    <div className="w-16 h-16 rounded-full flex items-center justify-center mb-6 mx-auto" style={{ background: 'var(--pill)', color: 'var(--accent-text)' }}>
                      <User size={32} />
                    </div>
                    <h3 className="font-sora text-xl font-bold text-center mb-2">¿Cómo te llamás?</h3>
                    <p className="text-xs text-center mb-6" style={{ color: 'var(--muted)' }}>Elegí un nombre para participar en el chat.</p>
                    <label htmlFor="chat-name" className="sr-only">Tu nombre</label>
                    <input
                      id="chat-name"
                      type="text"
                      maxLength={MAX_NAME_LENGTH}
                      value={userName}
                      onChange={(e) => setUserName(e.target.value)}
                      onKeyDown={(e) => { if (e.key === 'Enter') saveUserName(); }}
                      placeholder="Tu nombre o apodo"
                      className="w-full px-4 py-3 rounded-2xl text-[16px] mb-4 outline-none border-2 fm-input"
                    />
                    <button onClick={saveUserName} className="w-full py-3 font-bold rounded-2xl active:scale-95 transition-all" style={{ background: 'var(--accent)', color: 'var(--on-accent)' }}>
                      Empezar a chatear
                    </button>
                    <button onClick={() => setIsSettingName(false)} className="w-full mt-2 py-2 text-sm font-semibold" style={{ color: 'var(--muted)' }}>
                      Ahora no
                    </button>
                  </div>
                </div>
              )}

              {/* Barra de abajo */}
              <nav className={`relative z-20 shrink-0 w-full border-t transition-all duration-300 ${isInputFocused || keyboardOpen ? 'h-0 py-0 border-0 opacity-0 overflow-hidden pointer-events-none' : `${isShortScreen || isLandscapeHome ? 'pt-1 pb-[max(0.25rem,env(safe-area-inset-bottom,4px))]' : 'pt-2.5 pb-[max(0.85rem,env(safe-area-inset-bottom,14px))]'} px-2 min-[390px]:px-3 flex justify-around items-center`}`} style={{ background: 'var(--nav-bg)', borderColor: 'var(--line)' }}>
                <NavButton icon={<Radio size={22} />} label="Radio" isActive={activeTab === 'home'} onClick={() => setActiveTab('home')} />
                <NavButton icon={<MessageCircle size={22} />} label="Chat" isActive={activeTab === 'chat'} onClick={() => setActiveTab('chat')} badge={unreadCount} />
                <NavButton icon={<MonitorPlay size={22} />} label="En vivo" isActive={activeTab === 'live'} onClick={() => setActiveTab('live')} />
                <NavButton icon={<CalendarDays size={22} />} label="Programación" isActive={activeTab === 'schedule'} onClick={() => setActiveTab('schedule')} />
              </nav>
            </div>

            <style dangerouslySetInnerHTML={{__html: `
              .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
              .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
              .custom-scrollbar::-webkit-scrollbar-thumb { background-color: var(--line-strong); border-radius: 20px; }
              .scale-in { animation: scaleIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
              @keyframes scaleIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
            `}} />
          </div>
        );
      }

      function NavButton({ icon, label, isActive, onClick, badge }) {
        return (
          <button onClick={onClick} aria-current={isActive ? 'page' : undefined} className="relative flex flex-col items-center gap-1 min-w-[64px] py-0.5" style={{ color: isActive ? 'var(--accent-text)' : 'var(--muted)' }}>
            <span className="flex px-4 py-[5px] rounded-full transition-colors" style={{ background: isActive ? 'var(--pill)' : 'transparent' }}>{icon}</span>
            <span className={`text-[11px] ${isActive ? 'font-bold' : 'font-semibold'}`}>{label}</span>
            {badge > 0 && (
              <span className="absolute top-0 right-2.5 min-w-[18px] h-[18px] px-1 rounded-full text-white text-[10px] font-extrabold flex items-center justify-center" style={{ background: 'var(--live)' }}>
                {badge > 9 ? '9+' : badge}
              </span>
            )}
          </button>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));

      // Si algo falla, se muestra un aviso con botón para recargar en vez de una pantalla negra.
      class ErrorBoundary extends React.Component {
        constructor(props) {
          super(props);
          this.state = { failed: false };
        }
        static getDerivedStateFromError() {
          return { failed: true };
        }
        componentDidCatch(error) {
          console.error('Error en la app:', error);
        }
        render() {
          if (!this.state.failed) return this.props.children;
          return (
            <div className="app-fallback">
              <div>
                <img src="logo.png" alt="FM Apocalipsis 100.7" />
                <strong>FM Apocalipsis 100.7</strong>
                <p>Algo salió mal al cargar la radio.</p>
                <button
                  type="button"
                  onClick={() => window.location.reload()}
                  style={{ marginTop: '1rem', padding: '0.7rem 1.4rem', borderRadius: '999px', border: 0, background: '#FFD84D', color: '#0B1D1B', fontWeight: 700, fontSize: '0.9rem', cursor: 'pointer' }}
                >
                  Recargar
                </button>
              </div>
            </div>
          );
        }
      }

      root.render(<ErrorBoundary><App /></ErrorBoundary>);

    </script>
  </body>
</html>
