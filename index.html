<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="description" content="FM Apocalipsis 100.7 - Radio en vivo" />
    <title>FM Apocalipsis 100.7</title>

    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="logo.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = { darkMode: 'class' };
    </script>

    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #0a0a0a;
        overscroll-behavior: none;
      }
      .animate-spin-slow {
        animation: spin 2s linear infinite;
      }
      .app-fallback {
        min-height: 100%;
        display: grid;
        place-items: center;
        color: #f8fafc;
        text-align: center;
        padding: 2rem;
        box-sizing: border-box;
      }
      .app-fallback img {
        width: 96px;
        height: 96px;
        border-radius: 24px;
        object-fit: cover;
        margin: 0 auto 1rem;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
      }
      .app-fallback p {
        margin: 0.35rem 0 0;
        color: #94a3b8;
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-fallback">
        <div>
          <img src="logo.png" alt="FM Apocalipsis 100.7" />
          <strong>FM Apocalipsis 100.7</strong>
          <p>Cargando la radio...</p>
        </div>
      </div>
    </div>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script>
      window.react = window.React;
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script>
      window.__firebase_config = {
        apiKey: "AIzaSyA08xzcxTLjZT3kh5e5A57pBvHRlwETe-w",
        authDomain: "fmapolipsischat.firebaseapp.com",
        projectId: "fmapolipsischat",
        storageBucket: "fmapolipsischat.firebasestorage.app",
        messagingSenderId: "41472374951",
        appId: "1:41472374951:web:27a9ba0cd3e6f590a84382"
      };
      window.__app_id = "radio-apocalipsis-default";
    </script>
    <script src="https://unpkg.com/lucide-react@0.468.0/dist/umd/lucide-react.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

    <script type="text/babel" data-presets="env,react">
      const { useState, useRef, useEffect, useMemo } = React;
      const {
        Play,
        Pause,
        Radio,
        Volume2,
        VolumeX,
        Volume1,
        X,
        MessageCircle,
        MoreVertical,
        Minus,
        CalendarDays,
        MonitorPlay,
        Youtube,
        Facebook,
        Users,
        Sun,
        Moon,
        Clock,
        RefreshCw,
        Bell,
        BellRing,
        Share2,
        Download,
        AlertTriangle,
        Send,
        User,
        Trash2,
        Smile
      } = LucideReact;

      // Compat helpers para soportar sintaxis modular sobre SDK compat
      const initializeApp = (config) => {
        if (!config || typeof firebase === 'undefined') return null;
        return firebase.apps && firebase.apps.length ? firebase.app() : firebase.initializeApp(config);
      };
      const getAuth = (app) => app ? firebase.auth(app) : null;
      const getFirestore = (app) => app ? firebase.firestore(app) : null;
      const signInAnonymously = (authRef) => authRef.signInAnonymously();
      const signInWithCustomToken = (authRef, token) => authRef.signInWithCustomToken(token);
      const onAuthStateChanged = (authRef, cb) => authRef.onAuthStateChanged(cb);
      const serverTimestamp = () => firebase.firestore.FieldValue.serverTimestamp();

      const resolvePath = (dbRef, segments) => {
        let ref = dbRef;
        segments.forEach((segment, index) => {
          ref = index % 2 === 0 ? ref.collection(segment) : ref.doc(segment);
        });
        return ref;
      };

      const collection = (dbRef, ...segments) => resolvePath(dbRef, segments);
      const doc = (dbRef, ...segments) => resolvePath(dbRef, segments);
      const addDoc = (collectionRef, data) => collectionRef.add(data);
      const onSnapshot = (ref, next, error) => ref.onSnapshot(next, error);
      const query = (ref) => ref;
      const setDoc = (docRef, data, opts) => docRef.set(data, opts);
      const deleteDoc = (docRef) => docRef.delete();

      const rawFirebaseConfig = (typeof __firebase_config !== 'undefined' && __firebase_config)
        ? __firebase_config
        : (window.__firebase_config || null);
      const parsedFirebaseConfig = typeof rawFirebaseConfig === 'string'
        ? JSON.parse(rawFirebaseConfig)
        : rawFirebaseConfig;

      const appId = typeof __app_id !== 'undefined' ? __app_id : (window.__app_id || 'radio-apocalipsis-default');
      const app = initializeApp(parsedFirebaseConfig);
      const auth = getAuth(app);
      const db = getFirestore(app);

      const CHAT_HISTORY_LIMIT = 100;
      const MAX_MESSAGE_LENGTH = 300;
      const MAX_NAME_LENGTH = 15;
      const REMINDER_LEAD_MINUTES = 5;
      const DAY_LETTERS = ['D', 'L', 'M', 'X', 'J', 'V', 'S'];

      const TikTokIcon =({ size = 24, className = "" }) => (
        <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor" className={className}>
          <path d="M19.59 6.69a4.83 4.83 0 0 1-3.77-4.25V2h-3.45v13.67a2.89 2.89 0 0 1-5.2 1.74 2.89 2.89 0 0 1 2.31-4.64 2.93 2.93 0 0 1 .88.13V9.4a6.84 6.84 0 0 0-1-.05A6.33 6.33 0 0 0 5 20.1a6.34 6.34 0 0 0 10.86-4.43v-7a8.16 8.16 0 0 0 4.77 1.52v-3.4a4.85 4.85 0 0 1-1-.1z"/>
        </svg>
      );

      const isStandaloneDisplayMode = () => (
        window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone === true
      );

      function App() {
        const [isPlaying, setIsPlaying] = useState(false);
        const [activeTab, setActiveTab] = useState('home');
        const [volume, setVolume] = useState(() => {
          try {
            const saved = Number.parseInt(window.localStorage.getItem('fm-volume'), 10);
            return Number.isFinite(saved) && saved > 0 && saved <= 100 ? saved : 80;
          } catch (_) {
            return 80;
          }
        });
        const [volumeDragging, setVolumeDragging] = useState(false);
        // true cuando el dispositivo no deja cambiar el volumen desde la página (iPhone sin CORS).
        const [volumeLocked, setVolumeLocked] = useState(false);
        const volumeTrackRef = useRef(null);
        const [isMuted, setIsMuted] = useState(false);
        const [selectedDay, setSelectedDay] = useState('L');
        const [streamError, setStreamError] = useState(false);
        const [nowPlaying, setNowPlaying] = useState('');
        const [updateWorker, setUpdateWorker] = useState(null);
        const [applyingUpdate, setApplyingUpdate] = useState(false);
        const [updateMinimized, setUpdateMinimized] = useState(false);
        const audioGraph = useRef(null);
        const nativeVolumeSupported = useRef(null);
        const updateRequested = useRef(false);

        useEffect(() => {
          if (!('serviceWorker' in navigator) || !window.isSecureContext) return;
          let disposed = false;
          let registration;
          let installing;
          const onInstalled = () => {
            if (!disposed && registration?.waiting && navigator.serviceWorker.controller) {
              setUpdateWorker(registration.waiting);
            }
          };
          const onUpdateFound = () => {
            installing?.removeEventListener('statechange', onInstalled);
            installing = registration.installing;
            installing?.addEventListener('statechange', onInstalled);
          };
          const checkForUpdate = () => {
            if (document.visibilityState === 'visible') registration?.update().catch(() => {});
          };
          const onControllerChange = () => {
            if (updateRequested.current) window.location.reload();
          };
          navigator.serviceWorker.addEventListener('controllerchange', onControllerChange);
          navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then((reg) => {
            if (disposed) return;
            registration = reg;
            registration.addEventListener('updatefound', onUpdateFound);
            onUpdateFound();
            onInstalled();
            checkForUpdate();
          }).catch(() => {});
          document.addEventListener('visibilitychange', checkForUpdate);
          window.addEventListener('online', checkForUpdate);
          const timer = setInterval(checkForUpdate, 60000);
          return () => {
            disposed = true;
            clearInterval(timer);
            registration?.removeEventListener('updatefound', onUpdateFound);
            installing?.removeEventListener('statechange', onInstalled);
            navigator.serviceWorker.removeEventListener('controllerchange', onControllerChange);
            document.removeEventListener('visibilitychange', checkForUpdate);
            window.removeEventListener('online', checkForUpdate);
          };
        }, []);

        const applyUpdate = () => {
          if (!updateWorker) return;
          if (updateWorker.state === 'activated') {
            window.location.reload();
            return;
          }
          updateRequested.current = true;
          setApplyingUpdate(true);
          // Release the live connection before replacing the offline worker.
          if (audioRef.current) {
            audioRef.current.pause();
            audioRef.current.removeAttribute('src');
            audioRef.current.load();
          }
          updateWorker.postMessage({ type: 'SKIP_WAITING' });
        };

        const [user, setUser] = useState(null);
        const [messages, setMessages] = useState([]);
        const [newMessage, setNewMessage] = useState('');
        const [userName, setUserName] = useState(() => {
          try {
            return window.localStorage.getItem('fm-chat-apodo') || '';
          } catch (_) {
            return '';
          }
        });
        const [isSettingName, setIsSettingName] = useState(false);
        const chatReadKey = `fm-chat-read-${appId}`;
        const [readMessageIds, setReadMessageIds] = useState(() => {
          try {
            const saved = JSON.parse(window.localStorage.getItem(chatReadKey) || '[]');
            return new Set(Array.isArray(saved) ? saved.filter((id) => typeof id === 'string') : []);
          } catch (_) {
            return new Set();
          }
        });
        const [pageVisible, setPageVisible] = useState(() => document.visibilityState === 'visible');
        const unreadCount = messages.filter((msg) => msg.userId !== user?.uid && !readMessageIds.has(msg.id)).length;

        useEffect(() => {
          const onVisibilityChange = () => setPageVisible(document.visibilityState === 'visible');
          document.addEventListener('visibilitychange', onVisibilityChange);
          return () => document.removeEventListener('visibilitychange', onVisibilityChange);
        }, []);
        const [isInputFocused, setIsInputFocused] = useState(false);
        const [msgToDelete, setMsgToDelete] = useState(null);
        const [showEmojis, setShowEmojis] = useState(false);
        const chatScrollRef = useRef(null);
        const pressTimer = useRef(null);
        const sendingRef = useRef(false);

        const [scheduleData, setScheduleData] = useState({
          'L': [], 'M': [], 'X': [], 'J': [], 'V': [], 'S': [], 'D': []
        });
        const [promoGifs, setPromoGifs] = useState([]);

        const [currentAdIndex, setCurrentAdIndex] = useState(0);
        const [reminders, setReminders] = useState(() => {
          try {
            const saved = JSON.parse(window.localStorage.getItem('fm-reminders') || '[]');
            return new Set(Array.isArray(saved) ? saved.filter((key) => typeof key === 'string') : []);
          } catch (_) {
            return new Set();
          }
        });
        const [toastMsg, setToastMsg] = useState(null);
        const [themeMode, setThemeMode] = useState(() => {
          try {
            return window.localStorage.getItem('fm-theme-mode') || 'auto';
          } catch (_) {
            return 'auto';
          }
        });
        const [isDark, setIsDark] = useState(true);
        const [currentProgram, setCurrentProgram] = useState(null);
        const [viewportHeight, setViewportHeight] = useState(() => window.innerHeight);
        const [viewportWidth, setViewportWidth] = useState(() => window.innerWidth);
        const artAreaRef = useRef(null);
        const [artSize, setArtSize] = useState(0);
        // Pantallas bajas (notebooks 720p, ventanas chicas, app instalada en PC).
        const isShortScreen = viewportHeight < 640;
        // Celular acostado o ventana muy apaisada: portada a la izquierda y controles a la derecha.
        const isLandscapeHome = viewportWidth > viewportHeight * 1.25 && viewportHeight < 560 && viewportWidth >= 520;
        // En PC la tarjeta flotante solo deja márgenes si sobra altura.
        const useFloatingCard = viewportHeight >= 720;
        const [viewportOffsetTop, setViewportOffsetTop] = useState(0);
        const [keyboardOpen, setKeyboardOpen] = useState(false);

        const [deferredPrompt, setDeferredPrompt] = useState(null);
        const [isInstallable, setIsInstallable] = useState(false);
        const [isAppInstalled, setIsAppInstalled] = useState(() => isStandaloneDisplayMode());

        const audioRef = useRef(null);
        const [isBuffering, setIsBuffering] = useState(false);
        const reloadingRef = useRef(false);
        const userPausedRef = useRef(true);
        const reconnectAttempts = useRef(0);
        const reconnectTimer = useRef(null);
        const toastTimer = useRef(null);
        const stallTimer = useRef(null);
        const streamUrl = "https://server.streamcasthd.com/8422/stream";
        const statsUrl = "https://server.streamcasthd.com:7210/stats?sid=1&json=1";
        const googleSheetsCsvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQP-N3so4cbqVC-4RfmlqZlRZapDugeYTSfrAjDKj8UghSOuqrvipAXXTQBCV5WEIoSajBhLoYfk5cO/pub?output=csv";

        const timeToMinutes = (value) => {
          if (!value) return Number.MAX_SAFE_INTEGER;
          const match = String(value).trim().match(/^(\d{1,2})(?::(\d{1,2}))?/);
          if (!match) return Number.MAX_SAFE_INTEGER;
          const hours = Number.parseInt(match[1], 10);
          const minutes = Number.parseInt(match[2] || '0', 10);
          if (!Number.isFinite(hours) || !Number.isFinite(minutes)) return Number.MAX_SAFE_INTEGER;
          return (hours * 60) + minutes;
        };

        const normalizeHeader = (value) => String(value || '')
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .trim()
          .toLowerCase();

        const findColumnIndex = (headers, aliases) => {
          const normalizedAliases = aliases.map(normalizeHeader);
          return headers.findIndex((header) => normalizedAliases.includes(normalizeHeader(header)));
        };

        const normalizeWhatsAppPhone = (value) => {
          const digits = String(value || '').replace(/\D/g, '');
          return digits.length >= 8 ? digits : '';
        };

        const getWhatsAppUrl = (program) => {
          const phone = normalizeWhatsAppPhone(program?.phone);
          if (!phone) return '';
          const message = encodeURIComponent(`Hola, escucho ${program?.title || 'el programa'} por FM Apocalipsis 100.7`);
          return `https://wa.me/${phone}?text=${message}`;
        };

        const formatMsgDate = (timestamp) => {
          if (!timestamp) return "";
          try {
            const date = timestamp.toDate ? timestamp.toDate() : new Date(timestamp);
            return new Intl.DateTimeFormat('es-AR', { hour: '2-digit', minute: '2-digit' }).format(date);
          } catch (e) {
            return "";
          }
        };

        const toggleThemeMode = () => {
          if (themeMode === 'auto') setThemeMode('light');
          else if (themeMode === 'light') setThemeMode('dark');
          else setThemeMode('auto');
        };

        useEffect(() => {
          const visualViewport = window.visualViewport;
          const updateViewport = () => {
            const currentHeight = visualViewport ? Math.round(visualViewport.height) : window.innerHeight;
            setViewportHeight(currentHeight);
            setViewportWidth(visualViewport ? Math.round(visualViewport.width) : window.innerWidth);
            const currentOffsetTop = visualViewport ? Math.max(0, Math.round(visualViewport.offsetTop)) : 0;
            setViewportOffsetTop(currentOffsetTop);

            const delta = window.innerHeight - currentHeight;
            setKeyboardOpen(activeTab === 'chat' && delta > 120);
          };

          updateViewport();
          window.addEventListener('resize', updateViewport);
          if (visualViewport) {
            visualViewport.addEventListener('resize', updateViewport);
            visualViewport.addEventListener('scroll', updateViewport);
          }

          return () => {
            window.removeEventListener('resize', updateViewport);
            if (visualViewport) {
              visualViewport.removeEventListener('resize', updateViewport);
              visualViewport.removeEventListener('scroll', updateViewport);
            }
          };
        }, [activeTab]);

        useEffect(() => {
          if (!(activeTab === 'chat' && (isInputFocused || keyboardOpen))) return;

          const keepPageAtTop = () => {
            if (window.scrollY !== 0) {
              window.scrollTo(0, 0);
            }
          };

          keepPageAtTop();
          const t1 = setTimeout(keepPageAtTop, 60);
          const t2 = setTimeout(keepPageAtTop, 180);

          window.addEventListener('scroll', keepPageAtTop, { passive: true });
          return () => {
            clearTimeout(t1);
            clearTimeout(t2);
            window.removeEventListener('scroll', keepPageAtTop);
          };
        }, [activeTab, isInputFocused, keyboardOpen]);

        useEffect(() => {
          const initAuth = async () => {
            if (!auth) return;
            try {
              if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                await signInWithCustomToken(auth, __initial_auth_token);
              } else {
                await signInAnonymously(auth);
              }
            } catch (error) {
              console.error("Error Auth:", error);
            }
          };
          initAuth();
          if (!auth) return;
          const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
            setUser(currentUser);
            if (currentUser?.displayName) {
              setUserName(currentUser.displayName);
              try {
                window.localStorage.setItem('fm-chat-apodo', currentUser.displayName);
              } catch (_) {
              }
            }
          });
          return () => unsubscribe();
        }, []);

        useEffect(() => {
          if (!user || !db) return;
          const messagesCollection = collection(db, 'artifacts', appId, 'public', 'data', 'messages');
          // Solo se piden los últimos mensajes, no toda la historia del chat.
          const recentMessages = messagesCollection.orderBy('timestamp').limitToLast(CHAT_HISTORY_LIMIT);
          const unsubscribe = onSnapshot(recentMessages, (snapshot) => {
            const msgs = snapshot.docs.map((docItem) => ({ id: docItem.id, ...docItem.data({ serverTimestamps: 'estimate' }) }));
            msgs.sort((a, b) => (a.timestamp?.seconds || 0) - (b.timestamp?.seconds || 0)
              || (a.timestamp?.nanoseconds || 0) - (b.timestamp?.nanoseconds || 0)
              || a.id.localeCompare(b.id));
            setMessages(msgs.slice(-CHAT_HISTORY_LIMIT));
          }, (error) => {
            console.error("Error Chat:", error);
          });
          return () => unsubscribe();
        }, [user?.uid]);

        useEffect(() => {
          if (activeTab !== 'chat' || !pageVisible || messages.length === 0) return;
          const ids = messages.map((msg) => msg.id);
          setReadMessageIds(new Set(ids));
          try {
            window.localStorage.setItem(chatReadKey, JSON.stringify(ids));
          } catch (_) {
          }
        }, [activeTab, pageVisible, messages]);

        useEffect(() => {
          if (activeTab !== 'chat') return;
          const chatContainer = chatScrollRef.current;
          if (!chatContainer) return;
          requestAnimationFrame(() => {
            chatContainer.scrollTop = chatContainer.scrollHeight;
          });
        }, [messages, activeTab, keyboardOpen, showEmojis]);

        const handlePressStart = (msg) => {
          if (msg.userId !== user?.uid) return;
          pressTimer.current = setTimeout(() => {
            setMsgToDelete(msg);
            pressTimer.current = null;
          }, 500);
        };

        const handlePressCancel = () => {
          if (pressTimer.current) {
            clearTimeout(pressTimer.current);
            pressTimer.current = null;
          }
        };

        const confirmDeleteMessage = async () => {
          if (!msgToDelete || !db) return;
          try {
            await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'messages', msgToDelete.id));
            setMsgToDelete(null);
            showToast("Mensaje eliminado");
          } catch (error) {
            showToast("No se pudo eliminar");
          }
        };

        const handleSendMessage = async (e) => {
          e.preventDefault();
          const text = newMessage.trim().slice(0, MAX_MESSAGE_LENGTH);
          if (!text || !user || !db || sendingRef.current) return;
          const savedName = userName.trim().slice(0, MAX_NAME_LENGTH);
          if (!savedName) {
            setIsSettingName(true);
            return;
          }
          sendingRef.current = true;
          try {
            const messagesCollection = collection(db, 'artifacts', appId, 'public', 'data', 'messages');
            await addDoc(messagesCollection, {
              text,
              sender: savedName,
              userId: user.uid,
              timestamp: serverTimestamp()
            });
            setNewMessage('');
          } catch (error) {
            showToast("Error al enviar mensaje");
          } finally {
            sendingRef.current = false;
          }
        };

        const saveUserName = () => {
          const savedName = userName.trim();
          if (savedName) {
            setUserName(savedName);
            try {
              window.localStorage.setItem('fm-chat-apodo', savedName);
            } catch (_) {
            }
            setIsSettingName(false);
            showToast(`¡Hola ${savedName}!`);
          }
        };

        useEffect(() => {
          const handleBeforeInstallPrompt = (e) => {
            e.preventDefault();
            setDeferredPrompt(e);
            setIsAppInstalled(false);
            setIsInstallable(true);
          };
          const handleAppInstalled = () => {
            setDeferredPrompt(null);
            setIsAppInstalled(true);
            setIsInstallable(false);
          };
          window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
          window.addEventListener('appinstalled', handleAppInstalled);
          return () => {
            window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
            window.removeEventListener('appinstalled', handleAppInstalled);
          };
        }, []);

        useEffect(() => {
          const ua = navigator.userAgent || '';
          const isMobile = /Android|iPhone|iPad|iPod/i.test(ua);

          const updateInstallVisibility = () => {
            const standalone = isStandaloneDisplayMode();
            if (standalone) {
              setIsAppInstalled(true);
              setIsInstallable(false);
              return;
            }
            if (isAppInstalled) {
              setIsInstallable(false);
              return;
            }
            if (deferredPrompt) {
              setIsInstallable(true);
              return;
            }
            // Fallback: algunos navegadores móviles (incluyendo Samsung Internet)
            // no disparan beforeinstallprompt consistentemente.
            setIsInstallable(isMobile);
          };

          updateInstallVisibility();
          window.addEventListener('focus', updateInstallVisibility);
          document.addEventListener('visibilitychange', updateInstallVisibility);
          return () => {
            window.removeEventListener('focus', updateInstallVisibility);
            document.removeEventListener('visibilitychange', updateInstallVisibility);
          };
        }, [deferredPrompt, isAppInstalled]);

        const handleInstallClick = async () => {
          if (isStandaloneDisplayMode()) return;

          if (deferredPrompt) {
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            if (outcome === 'accepted') setIsInstallable(false);
            setDeferredPrompt(null);
            return;
          }

          const ua = navigator.userAgent || '';
          if (/iPhone|iPad|iPod/i.test(ua)) {
            showToast('iPhone: Compartir > Añadir a pantalla de inicio');
          } else {
            showToast('Menú ⋮ > Instalar app');
          }
        };

        const handleShare = async () => {
          const shareData = { title: 'FM Apocalipsis 100.7', url: window.location.href };
          if (navigator.share) {
            try {
              await navigator.share(shareData);
            } catch (err) {
            }
          } else {
            try {
              const textArea = document.createElement("textarea");
              textArea.value = window.location.href;

                          </div>
                          <div className="w-px h-10 shrink-0 bg-gray-300 dark:bg-slate-800"></div>
                          {p.image && <img src={p.image} alt={p.title} className="w-10 h-10 shrink-0 rounded-lg object-cover ring-1 ring-black/5 dark:ring-white/10 shadow-sm" />}
                          <div className="flex-1 min-w-0 overflow-hidden pr-1">
                            <h3 className={`text-sm font-medium leading-snug flex items-start gap-2 ${isDark ? 'text-slate-100' : 'text-slate-900'}`}>
                              <span className="line-clamp-2 break-words min-w-0">{p.title}</span>
                              {isCurrentProgram(p) && (
                                <span className="flex h-2 w-2 relative shrink-0">
                                  <span className="animate-ping absolute inline-flex h-full w-full rounded-full opacity-75 bg-amber-400"></span>
                                  <span className="relative inline-flex rounded-full h-2 w-2 bg-amber-500"></span>
                                </span>
                              )}
                            </h3>
                            <p className={`text-xs mt-0.5 leading-snug ${isDark ? 'text-slate-400' : 'text-gray-600'}`}>{p.hosts}</p>
                          </div>
                          {isCurrentProgram(p) && getWhatsAppUrl(p) ? (
                            <a
                              href={getWhatsAppUrl(p)}
                              target="_blank"
                              rel="noopener noreferrer"
                              className="p-2 rounded-full bg-green-600 text-white shadow-md shadow-green-600/20 active:scale-90 transition-all"
                              aria-label={`WhatsApp de ${p.title}`}
                            >
                              <MessageCircle size={18} />
                            </a>
                          ) : (
                            <button
                              onClick={() => toggleReminder(p)}
                              aria-pressed={reminders.has(getReminderKey(p))}
                              aria-label={reminders.has(getReminderKey(p)) ? `Quitar recordatorio de ${p.title}` : `Recordarme ${p.title}`}
                              className={`p-2 rounded-full transition-colors ${reminders.has(getReminderKey(p))
                                ? (isDark ? 'text-amber-400 bg-amber-500/10' : 'text-blue-600 bg-blue-50')
                                : (isDark ? 'text-slate-500 hover:text-amber-500' : 'text-gray-400 hover:text-blue-600')}`}
                            >
                              {reminders.has(getReminderKey(p)) ? <BellRing size={18} /> : <Bell size={18} />}
                            </button>
                          )}
                        </div>
                      )) : <p className="text-center text-gray-400 dark:text-slate-500 text-sm py-10 font-medium">Sin programación para este día.</p>}
                    </div>
                  </div>
                )}
              </div>

              {msgToDelete && (
                <div className="absolute inset-0 z-[100] flex items-center justify-center p-6 bg-black/60 backdrop-blur-sm">
                  <div className="w-full max-w-xs bg-white dark:bg-slate-900 rounded-[2rem] p-6 shadow-2xl scale-in text-center">
                    <div className="w-16 h-16 bg-red-100 dark:bg-red-500/10 text-red-600 dark:text-red-500 rounded-full flex items-center justify-center mb-4 mx-auto">
                      <Trash2 size={28} />
                    </div>
                    <h3 className="text-lg font-bold mb-1 dark:text-white">¿Eliminar mensaje?</h3>
                    <p className="text-xs text-gray-500 mb-6">Esta acción no se puede deshacer.</p>
                    <div className="flex gap-3">
                      <button onClick={() => setMsgToDelete(null)} className="flex-1 py-3 rounded-xl bg-gray-100 dark:bg-slate-800 text-gray-700 dark:text-gray-300 font-bold text-sm transition-colors hover:bg-gray-200 dark:hover:bg-slate-700">Cancelar</button>
                      <button onClick={confirmDeleteMessage} className="flex-1 py-3 rounded-xl bg-red-600 text-white font-bold text-sm hover:bg-red-700 transition-colors shadow-lg shadow-red-600/30">Eliminar</button>
                    </div>
                  </div>
                </div>
              )}

              {isSettingName && (
                <div className="absolute inset-0 z-[60] flex items-center justify-center p-6 bg-black/60 backdrop-blur-md">
                  <div className="w-full max-w-xs bg-white dark:bg-slate-900 rounded-[2.5rem] p-8 shadow-2xl scale-in border dark:border-white/5">
                    <div className="w-16 h-16 bg-blue-500/20 dark:bg-amber-500/20 text-blue-600 dark:text-amber-500 rounded-full flex items-center justify-center mb-6 mx-auto">
                      <User size={32} />
                    </div>
                    <h3 className="text-xl font-bold text-center mb-2 dark:text-white">¿Quién eres?</h3>
                    <p className="text-xs text-gray-500 text-center mb-6">Elige un nombre para participar en el chat.</p>
                    <input
                      type="text"
                      maxLength={MAX_NAME_LENGTH}
                      value={userName}
                      onChange={(e) => setUserName(e.target.value)}
                      placeholder="Escribe tu apodo aquí..."
                      className="w-full bg-gray-100 dark:bg-slate-800 text-gray-900 dark:text-white px-4 py-3 rounded-2xl text-[16px] sm:text-sm mb-4 outline-none border-2 border-transparent focus:border-blue-500 dark:focus:border-amber-500 transition-all"
                    />
                    <button onClick={saveUserName} className="w-full py-3 bg-blue-600 dark:bg-amber-500 text-white dark:text-slate-950 font-bold rounded-2xl hover:opacity-90 active:scale-95 transition-all shadow-lg">
                      Comenzar a chatear
                    </button>
                  </div>
                </div>
              )}

              <div className={`shrink-0 w-full bg-white/90 dark:bg-slate-950/80 backdrop-blur-xl border-t border-gray-200 dark:border-slate-800/80 transition-all duration-300 z-20 ${isInputFocused || keyboardOpen ? 'h-0 py-0 border-0 opacity-0 overflow-hidden pointer-events-none' : `${isShortScreen || isLandscapeHome ? 'pt-1 pb-[max(0.25rem,env(safe-area-inset-bottom,4px))]' : 'pt-3 pb-[max(0.75rem,env(safe-area-inset-bottom,12px))]'} px-4 min-[400px]:px-8 flex justify-between items-center shadow-[0_-10px_40px_rgba(0,0,0,0.05)]`}`}>
                <NavButton icon={<Radio size={22} />} label="Radio" isActive={activeTab === 'home'} onClick={() => setActiveTab('home')} isDark={isDark} />
                <NavButton icon={<MessageCircle size={22} />} label="Chat" isActive={activeTab === 'chat'} onClick={() => setActiveTab('chat')} isDark={isDark} badge={unreadCount} />
                <NavButton icon={<MonitorPlay size={22} />} label="En Vivo" isActive={activeTab === 'live'} onClick={() => setActiveTab('live')} isDark={isDark} />
                <NavButton icon={<CalendarDays size={22} />} label="Programación" isActive={activeTab === 'schedule'} onClick={() => setActiveTab('schedule')} isDark={isDark} />
              </div>
            </div>

            <style dangerouslySetInnerHTML={{__html: `
              .custom-scrollbar::-webkit-scrollbar { width: 4px; }
              .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
              .custom-scrollbar::-webkit-scrollbar-thumb { background-color: ${isDark ? '#334155' : '#cbd5e1'}; border-radius: 20px; }
              .volume-thumb {
                width: 18px;
                height: 18px;
                border-width: 3px;
                border-style: solid;
                transform: translate(-50%, -50%);
                box-shadow: 0 2px 8px rgba(0,0,0,0.25);
                transition: transform 0.15s ease, box-shadow 0.15s ease;
              }
              .volume-slider:hover .volume-thumb,
              .volume-thumb.is-dragging {
                transform: translate(-50%, -50%) scale(1.2);
                box-shadow: 0 0 0 6px color-mix(in srgb, var(--vol-color) 20%, transparent), 0 2px 8px rgba(0,0,0,0.25);
              }
              .volume-slider:focus-visible .volume-thumb {
                box-shadow: 0 0 0 4px color-mix(in srgb, var(--vol-color) 45%, transparent);
              }
              .volume-slider[aria-disabled="true"] .volume-thumb { transform: translate(-50%, -50%); }
              .volume-bubble { pointer-events: none; white-space: nowrap; }
              .scale-in { animation: scaleIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
              @keyframes scaleIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
              .metadata-marquee-container {
                width: 100%;
                overflow: hidden;
                white-space: nowrap;
                position: relative;
              }
              .metadata-marquee-track {
                display: inline-flex;
                align-items: center;
                gap: 3rem;
                min-width: max-content;
                font-size: 1.02rem;
                font-weight: 700;
                line-height: 1.2;
                animation: metadataScroll 24s linear infinite;
                will-change: transform;
              }
              @keyframes metadataScroll {
                0% { transform: translateX(0); }
                100% { transform: translateX(calc(-50% - 1.5rem)); }
              }
              @media (prefers-reduced-motion: reduce) {
                .metadata-marquee-track {
                  animation: none;
                }
              }
              .marquee-container { width: 100%; overflow: hidden; white-space: nowrap; position: relative; }
              .marquee-text { display: inline-block; padding-left: 100%; animation: marquee 15s linear infinite; }
              @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
              .install-cta::after {
                content: '';
                position: absolute;
                inset: -1px;
                border-radius: inherit;
                border: 1px solid rgba(255, 255, 255, 0.35);
                pointer-events: none;
                opacity: 0.8;
              }
              .install-cta-breathe {
                animation: installBreathe 2s ease-in-out infinite;
              }
              @keyframes installBreathe {
                0%, 100% { transform: scale(1); box-shadow: 0 8px 18px rgba(220,38,38,0.28); }
                50% { transform: scale(1.04); box-shadow: 0 10px 24px rgba(220,38,38,0.36); }
              }
              @media (prefers-reduced-motion: reduce) {
                .install-cta-breathe { animation: none; }
              }
            `}} />
          </div>
        );
      }

      function NavButton({ icon, label, isActive, onClick, isDark, badge }) {
        return (
          <button onClick={onClick} className="flex flex-col items-center justify-center p-2 transition-all duration-300 relative group">
            <div className={`mb-1 transition-transform duration-300 ${isActive ? '-translate-y-1 scale-110' : 'group-hover:scale-105'} ${isActive ? (isDark ? 'text-amber-500' : 'text-blue-600') : 'text-gray-500'}`}>
              {icon}
            </div>
            <span className={`text-[9px] font-medium transition-all duration-300 ${isActive ? 'opacity-100' : 'opacity-70'} ${isActive ? (isDark ? 'text-amber-500' : 'text-blue-600') : 'text-gray-500'}`}>
              {label}
            </span>

            {badge > 0 && (
              <div className="absolute top-1 right-1 bg-red-500 text-white text-[8px] font-black h-4 w-4 flex items-center justify-center rounded-full border-2 border-white dark:border-slate-950 animate-bounce shadow-lg">
                {badge > 9 ? '9+' : badge}
              </div>
            )}

            {isActive && (
              <div className={`absolute -bottom-1 h-1 w-1 rounded-full ${isDark ? 'bg-amber-500' : 'bg-blue-600'}`}></div>
            )}
          </button>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById('root'));
      // Si algo falla, se muestra un aviso con botón para recargar en vez de una pantalla negra.
      class ErrorBoundary extends React.Component {
        constructor(props) {
          super(props);
          this.state = { failed: false };
        }
        static getDerivedStateFromError() {
          return { failed: true };
        }
        componentDidCatch(error) {
          console.error('Error en la app:', error);
        }
        render() {
          if (!this.state.failed) return this.props.children;
          return (
            <div className="app-fallback">
              <div>
                <img src="logo.png" alt="FM Apocalipsis 100.7" />
                <strong>FM Apocalipsis 100.7</strong>
                <p>Algo salió mal al cargar la radio.</p>
                <button
                  type="button"
                  onClick={() => window.location.reload()}
                  style={{ marginTop: '1rem', padding: '0.7rem 1.4rem', borderRadius: '999px', border: 0, background: '#f59e0b', color: '#0a0a0a', fontWeight: 700, fontSize: '0.9rem', cursor: 'pointer' }}
                >
                  Recargar
                </button>
              </div>
            </div>
          );
        }
      }

      root.render(<ErrorBoundary><App /></ErrorBoundary>);

    </script>
  </body>
</html>
